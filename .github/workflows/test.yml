name: Test inference package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --find-links https://download.pytorch.org/whl/cpu/torch/ '.[dev,fasta]'
      - run: python -m pip check
      - name: Verify the installed Linux CPU build (independent of GPU availability)
        run: python -c "import torch; assert torch.__version__ == '2.10.0+cpu' and torch.version.cuda is None and torch.version.hip is None"
      - run: python -m pytest
      - run: python -m build
